<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cozy Wildlife</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 16px; left: 16px;
    color: #fff; font-size: 11px; font-family: ui-monospace, monospace;
    background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 10px;
    z-index: 10; pointer-events: none; line-height: 1.6; }
  .ok { color: #7dfba7; }
  #joy { position: fixed; left: 30px; bottom: 40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.35);
    z-index: 5; touch-action: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%;
    width: 55px; height: 55px; border-radius: 50%;
    background: rgba(255,255,255,0.5);
    border: 2px solid rgba(255,255,255,0.7);
    transform: translate(-50%, -50%);
    pointer-events: none; }
</style>
</head>
<body>
<div id="hud">
  <div id="rnd">Init...</div>
  <div id="fps">-- FPS</div>
</div>
<div id="joy"><div id="joyKnob"></div></div>

<script type="importmap">
{
  "imports": {
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three/webgpu';

const hudRnd = document.getElementById('rnd');
const hudFps = document.getElementById('fps');

const texLoader = new THREE.TextureLoader();
async function loadSprite(path) {
  const tex = await texLoader.loadAsync(path);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = false;
  return tex;
}

let renderer;
try {
  renderer = new THREE.WebGPURenderer({ antialias: false, alpha: false });
  await renderer.init();
} catch (e) {
  hudRnd.innerHTML = 'GAGAL: ' + e.message;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.touchAction = 'none';

hudRnd.innerHTML = 'Renderer: <span class="ok">WebGPU</span>';

const scene = new THREE.Scene();
const skyColor = 0xa8d0e8;
scene.background = new THREE.Color(skyColor);
scene.fog = new THREE.Fog(skyColor, 60, 140);

const sun = new THREE.DirectionalLight(0xfff0dd, 2.5);
sun.position.set(40, 80, 30);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xa8c8e0, 0.9));
scene.add(new THREE.HemisphereLight(0xbfd8e8, 0x5a6a3a, 0.6));

function hash2(x, y) {
  const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return n - Math.floor(n);
}
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, oct) {
  oct = oct || 4;
  let v = 0, a = 1, f = 1, total = 0;
  for (let i = 0; i < oct; i++) {
    v += a * valueNoise(x * f, y * f);
    total += a;
    f *= 2.03;
    a *= 0.5;
  }
  return v / total;
}

const WORLD_SIZE = 120;
const WORLD_SEG = 128;
const HEIGHT_SCALE = 12;

const terrainGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, WORLD_SEG, WORLD_SEG);
terrainGeo.rotateX(-Math.PI / 2);

const pos = terrainGeo.attributes.position;
const colors = new Float32Array(pos.count * 3);

const cLow = new THREE.Color(0x7ab04a);
const cMid = new THREE.Color(0x5a8e3a);
const cHigh = new THREE.Color(0x8a6a3a);
const cPeak = new THREE.Color(0x9a8a5a);

function terrainHeight(wx, wz) {
  const nx = wx * 0.04;
  const nz = wz * 0.04;
  let h = fbm(nx + 50, nz + 50);
  h = Math.pow(h, 1.3);
  h = h * HEIGHT_SCALE;
  const localN = valueNoise(wx * 0.15 + 200, wz * 0.15 + 200);
  h += (localN - 0.5) * 2.5;
  return h;
}

const _terrainCache = new Map();
function terrainHeightCached(wx, wz) {
  const key = (Math.round(wx * 2) / 2) + '_' + (Math.round(wz * 2) / 2);
  let v = _terrainCache.get(key);
  if (v === undefined) {
    v = terrainHeight(wx, wz);
    _terrainCache.set(key, v);
  }
  return v;
}

for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  const h = terrainHeight(x, z);
  pos.setY(i, h);

  const t = Math.max(0, Math.min(1, h / HEIGHT_SCALE));
  let c;
  if (t < 0.35) {
    const tt = t / 0.35;
    c = cLow.clone().lerp(cMid, tt);
  } else if (t < 0.75) {
    const tt = (t - 0.35) / 0.4;
    c = cMid.clone().lerp(cHigh, tt);
  } else {
    const tt = (t - 0.75) / 0.25;
    c = cHigh.clone().lerp(cPeak, tt);
  }

  const v = (valueNoise(x * 0.5, z * 0.5) - 0.5) * 0.12;
  colors[i * 3] = Math.max(0, Math.min(1, c.r + v));
  colors[i * 3 + 1] = Math.max(0, Math.min(1, c.g + v));
  colors[i * 3 + 2] = Math.max(0, Math.min(1, c.b + v));
}

terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrain);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 500);
const camY = 6;
const camZ = 16;

const spriteGroup = new THREE.Group();
scene.add(spriteGroup);

function placeSprite(tex, x, z, scale) {
  const material = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    alphaTest: 0.5,
    side: THREE.DoubleSide,
    depthWrite: true
  });
  const geo = new THREE.PlaneGeometry(scale, scale);
  const mesh = new THREE.Mesh(geo, material);
  const y = terrainHeightCached(x, z);
  mesh.position.set(x, y + scale * 0.4, z);
  spriteGroup.add(mesh);
  return mesh;
}

const treeTex = await loadSprite('IMG_2075.png');
const rockTex = await loadSprite('IMG_2073.png');
const bushTex = await loadSprite('IMG_2082.png');
const pineTex = await loadSprite('IMG_2088.png');
const mapleTex = await loadSprite('IMG_2097.png');

function placeTreeCluster(tex, cx, cz, count) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const rad = Math.random() * 5;
    const x = cx + Math.cos(ang) * rad;
    const z = cz + Math.sin(ang) * rad;
    const s = 2.6 + Math.random() * 1.0;
    placeSprite(tex, x, z, s);
  }
}

placeTreeCluster(treeTex, -18, -18, 7);
placeTreeCluster(treeTex, 20, -12, 6);
placeTreeCluster(treeTex, -10, 20, 8);
placeTreeCluster(pineTex, 22, 18, 5);
placeTreeCluster(treeTex, -28, 2, 6);
placeTreeCluster(pineTex, 5, -28, 5);
placeTreeCluster(mapleTex, -2, 8, 4);
placeTreeCluster(treeTex, 15, 3, 4);
placeTreeCluster(mapleTex, -22, -8, 4);

for (let i = 0; i < 8; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rad = 15 + Math.random() * 25;
  placeSprite(rockTex, Math.cos(ang) * rad, Math.sin(ang) * rad, 1.8 + Math.random() * 0.8);
}
for (let i = 0; i < 12; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rad = 10 + Math.random() * 30;
  placeSprite(bushTex, Math.cos(ang) * rad, Math.sin(ang) * rad, 1.6 + Math.random() * 0.6);
}

const playerGroup = new THREE.Group();

const playerShadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.55, 16),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false })
);
playerShadow.rotation.x = -Math.PI / 2;
playerShadow.position.y = 0.05;
playerGroup.add(playerShadow);

const playerBody = new THREE.Mesh(
  new THREE.PlaneGeometry(1.0, 1.6),
  new THREE.MeshBasicMaterial({ color: 0xff3366, transparent: true, side: THREE.DoubleSide })
);
playerBody.position.y = 0.85;
playerGroup.add(playerBody);

scene.add(playerGroup);

const camPos = new THREE.Vector3();
const camTarget = new THREE.Vector3();
const camSmoothPos = new THREE.Vector3();
const camSmoothTarget = new THREE.Vector3(0, 0, 0);

function updateCamera(instant) {
  const py = terrainHeightCached(playerGroup.position.x, playerGroup.position.z);
  camTarget.set(playerGroup.position.x, py + 1.2, playerGroup.position.z);
  camPos.set(
    playerGroup.position.x,
    py + camY,
    playerGroup.position.z + camZ
  );

  if (instant) {
    camSmoothPos.copy(camPos);
    camSmoothTarget.copy(camTarget);
  } else {
    camSmoothPos.lerp(camPos, 0.08);
    camSmoothTarget.lerp(camTarget, 0.1);
  }

  camera.position.copy(camSmoothPos);
  camera.lookAt(camSmoothTarget);

  spriteGroup.children.forEach(function(s) {
    s.quaternion.copy(camera.quaternion);
  });
  playerBody.quaternion.copy(camera.quaternion);
  playerGroup.position.y = terrainHeightCached(playerGroup.position.x, playerGroup.position.z);
}
updateCamera(true);

let pinchDist = 0;
let pinchStartFov = 38;
const el = renderer.domElement;

el.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    pinchStartFov = camera.fov;
  }
}, { passive: false });

el.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) {
      const ratio = d / pinchDist;
      camera.fov = Math.max(20, Math.min(60, pinchStartFov / ratio));
      camera.updateProjectionMatrix();
    }
  }
}, { passive: false });

el.addEventListener('touchend', function() {
  pinchDist = 0;
}, { passive: false });

const joy = document.getElementById('joy');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false;
let joyTouchId = null;
let joyCenterX = 0;
let joyCenterY = 0;
let joyVecX = 0;
let joyVecY = 0;

function joyRect() {
  const r = joy.getBoundingClientRect();
  joyCenterX = r.left + r.width / 2;
  joyCenterY = r.top + r.height / 2;
}

joy.addEventListener('touchstart', function(e) {
  e.preventDefault();
  e.stopPropagation();
  if (joyActive) return;
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyActive = true;
  joyRect();
  handleJoyMove(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (!joyActive) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === joyTouchId) {
      e.preventDefault();
      handleJoyMove(t.clientX, t.clientY);
    }
  }
}, { passive: false });

document.addEventListener('touchend', function(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === joyTouchId) {
      joyActive = false;
      joyTouchId = null;
      joyVecX = 0;
      joyVecY = 0;
      joyKnob.style.transform = 'translate(-50%, -50%)';
    }
  }
}, { passive: false });

function handleJoyMove(cx, cy) {
  let dx = cx - joyCenterX;
  let dy = cy - joyCenterY;
  const maxR = 55;
  const d = Math.hypot(dx, dy);
  if (d > maxR) {
    dx = dx / d * maxR;
    dy = dy / d * maxR;
  }
  joyVecX = dx / maxR;
  joyVecY = dy / maxR;
  joyKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
}

const playerSpeed = 7.0;

let frames = 0;
let lastFpsT = performance.now();
let lastT = performance.now();

function animate() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (Math.abs(joyVecX) > 0.05 || Math.abs(joyVecY) > 0.05) {
    playerGroup.position.x += joyVecX * playerSpeed * dt;
    playerGroup.position.z += joyVecY * playerSpeed * dt;
    const lim = WORLD_SIZE * 0.45;
    playerGroup.position.x = Math.max(-lim, Math.min(lim, playerGroup.position.x));
    playerGroup.position.z = Math.max(-lim, Math.min(lim, playerGroup.position.z));
  }

  updateCamera(false);
  renderer.render(scene, camera);
  frames++;

  if (now - lastFpsT > 500) {
    const fps = Math.round(frames * 1000 / (now - lastFpsT));
    hudFps.textContent = fps + ' FPS';
    frames = 0;
    lastFpsT = now;
  }
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', function() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
