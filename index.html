<script type="module">

const texLoader = new THREE.TextureLoader();
async function loadSprite(path) {
  const tex = await texLoader.loadAsync(path);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = false;
  return tex;
}

}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(0xa8d0e8, 60, 140);
// === SKY SPHERE GRADIENT ===
const skyGeo = new THREE.SphereGeometry(250, 24, 16);
const skyCols = [];
const skyPos = skyGeo.attributes.position;
for (let i = 0; i < skyPos.count; i++) {
  const y = skyPos.getY(i) / 250;
  const t = Math.max(0, Math.min(1, y * 0.5 + 0.5));

}
skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(skyCols, 3));
const skyMat = new THREE.MeshBasicMaterial({
  side: THREE.BackSide, fog: false, vertexColors: true, depthWrite: false
});
const skyMesh = new THREE.Mesh(skyGeo, skyMat);
scene.add(skyMesh);

// === CLOUD TEXTURE (procedural FBM) ===
function hash2c(x, y) {
  const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return n - Math.floor(n);
}
function vnoiseC(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2c(xi, yi), b = hash2c(xi + 1, yi);
  const c = hash2c(xi, yi + 1), d = hash2c(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbmC(x, y, oct) {
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) {
    v += a * vnoiseC(x * f, y * f);
    f *= 2.02;
    a *= 0.5;
  }
  return v;
}
function makeCloudTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const imgData = ctx.createImageData(size, size);
  const data = imgData.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const nx = x / size * 6;
      const ny = y / size * 6;
      const n = fbmC(nx, ny, 5);
      const cloud = Math.max(0, Math.min(1, (n - 0.42) * 3.2));
      const idx = (y * size + x) * 4;
      data[idx] = 255;
      data[idx + 1] = 255;
      data[idx + 2] = 255;
      data[idx + 3] = Math.floor(cloud * 230);
    }
  }
  ctx.putImageData(imgData, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const cloudTex = makeCloudTexture();

// === CLOUD PLANE ===
const cloudGeo = new THREE.PlaneGeometry(1200, 1200);
cloudGeo.rotateX(Math.PI / 2);
const cloudMat = new THREE.MeshBasicMaterial({
  map: cloudTex, transparent: true, depthWrite: false,

});
const cloudPlane = new THREE.Mesh(cloudGeo, cloudMat);
cloudPlane.position.y = 25;
scene.add(cloudPlane);

// === SUN SPRITE ===
function makeSunTex() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.0, 'rgba(255,255,240,1)');
  g.addColorStop(0.15, 'rgba(255,245,200,1)');
  g.addColorStop(0.35, 'rgba(255,225,150,0.6)');
  g.addColorStop(0.7, 'rgba(255,200,100,0.15)');
  g.addColorStop(1.0, 'rgba(255,180,80,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const sunSprite = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshBasicMaterial({
    map: makeSunTex(), transparent: true, depthWrite: false,
    fog: false, blending: THREE.AdditiveBlending

scene.add(sunSprite);

// === MOON SPRITE ===
function makeMoonTex() {
  const c = document.createElement('canvas');

  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.0, 'rgba(250,250,255,1)');
  g.addColorStop(0.25, 'rgba(230,235,250,0.9)');
  g.addColorStop(0.5, 'rgba(200,215,240,0.4)');
  g.addColorStop(1.0, 'rgba(160,190,230,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const moonSprite = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshBasicMaterial({
    map: makeMoonTex(), transparent: true, depthWrite: false,
    fog: false, blending: THREE.AdditiveBlending

scene.add(moonSprite);

// === STARS ===
const starCount = 300;
const starGeo = new THREE.BufferGeometry();
const starPosArr = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(Math.random() * 0.95 + 0.05);
  const r = 220;
  starPosArr[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPosArr[i * 3 + 1] = r * Math.cos(phi);
  starPosArr[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}

const starMat = new THREE.PointsMaterial({

// Day/night state
let virtualTimeSky = 0;
const DAY_DURATION = 180.0;

sun.position.set(40, 80, 30);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xa8c8e0, 0.9));
scene.add(new THREE.HemisphereLight(0xbfd8e8, 0x5a6a3a, 0.6));

const skyGeo = new THREE.SphereGeometry(250, 16, 32);
const skyColors = [];
const skyPos = skyGeo.attributes.position;
const skyTop = new THREE.Color(0x5a9ac8);
const skyBot = new THREE.Color(0xe8e0c8);
for (let i = 0; i < skyPos.count; i++) {
  const y = skyPos.getY(i);
  const t = Math.max(0, Math.min(1, (y / 250) * 0.5 + 0.5));
  const c = skyBot.clone().lerp(skyTop, t);
  skyColors.push(c.r, c.g, c.b);
}
skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(skyColors, 3));
const skyMesh = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({
  side: THREE.BackSide,
  fog: false,
  vertexColors: true
}));
scene.add(skyMesh);

function hash2(x, y) {
  const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return n - Math.floor(n);
}
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, oct) {
  oct = oct || 4;
  let v = 0, a = 1, f = 1, total = 0;
  for (let i = 0; i < oct; i++) {
    v += a * valueNoise(x * f, y * f);
    total += a;
    f *= 2.03;
    a *= 0.5;
  }
  return v / total;
}

const WORLD_SIZE = 120;
const WORLD_SEG = 128;
const HEIGHT_SCALE = 12;

const terrainGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, WORLD_SEG, WORLD_SEG);
terrainGeo.rotateX(-Math.PI / 2);

const pos = terrainGeo.attributes.position;
const colors = new Float32Array(pos.count * 3);

const cLow = new THREE.Color(0x7ab04a);
const cMid = new THREE.Color(0x5a8e3a);
const cHigh = new THREE.Color(0x8a6a3a);
const cPeak = new THREE.Color(0x9a8a5a);

function terrainHeight(wx, wz) {
  const nx = wx * 0.04;
  const nz = wz * 0.04;
  let h = fbm(nx + 50, nz + 50);
  h = Math.pow(h, 1.3);
  h = h * HEIGHT_SCALE;
  const localN = valueNoise(wx * 0.15 + 200, wz * 0.15 + 200);
  h += (localN - 0.5) * 2.5;
  return h;
}

const _terrainCache = new Map();
function terrainHeightCached(wx, wz) {
  const key = (Math.round(wx * 2) / 2) + '_' + (Math.round(wz * 2) / 2);
  let v = _terrainCache.get(key);
  if (v === undefined) {
    v = terrainHeight(wx, wz);
    _terrainCache.set(key, v);
  }
  return v;
}

for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  const h = terrainHeight(x, z);
  pos.setY(i, h);

  const t = Math.max(0, Math.min(1, h / HEIGHT_SCALE));
  let c;
  if (t < 0.35) {
    const tt = t / 0.35;
    c = cLow.clone().lerp(cMid, tt);
  } else if (t < 0.75) {
    const tt = (t - 0.35) / 0.4;
    c = cMid.clone().lerp(cHigh, tt);
  } else {
    const tt = (t - 0.75) / 0.25;
    c = cHigh.clone().lerp(cPeak, tt);
  }

  const v = (valueNoise(x * 0.5, z * 0.5) - 0.5) * 0.12;
  colors[i * 3] = Math.max(0, Math.min(1, c.r + v));
  colors[i * 3 + 1] = Math.max(0, Math.min(1, c.g + v));
  colors[i * 3 + 2] = Math.max(0, Math.min(1, c.b + v));
}

terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrain);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 1000);
const camY = 6;
const camZ = 16;

const cloudGroup = new THREE.Group();
scene.add(cloudGroup);

function makeCloudTexture() {
  const c = document.createElement('canvas');
  c.width = 128;
  c.height = 64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 128, 64);
  for (let i = 0; i < 12; i++) {
    const cx = 20 + Math.random() * 88;
    const cy = 20 + Math.random() * 24;
    const r = 8 + Math.random() * 12;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(255,255,255,0.9)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  return tex;
}
const cloudTex = makeCloudTexture();

for (let i = 0; i < 12; i++) {
  const mat = new THREE.MeshBasicMaterial({
    map: cloudTex,
    transparent: true,
    opacity: 0.7 + Math.random() * 0.3,
    depthWrite: false,
    fog: false
  });
  const w = 30 + Math.random() * 30;
  const geo = new THREE.PlaneGeometry(w, w * 0.5);
  const cloud = new THREE.Mesh(geo, mat);
  const ang = Math.random() * Math.PI * 2;
  const rad = 50 + Math.random() * 80;
  cloud.position.set(
    Math.cos(ang) * rad,
    40 + Math.random() * 30,
    Math.sin(ang) * rad
  );
  cloud.userData.speed = 0.3 + Math.random() * 0.5;
  cloudGroup.add(cloud);
}

const spriteGroup = new THREE.Group();
scene.add(spriteGroup);

function placeSprite(tex, x, z, scale) {
  const material = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    alphaTest: 0.5,
    side: THREE.DoubleSide,
    depthWrite: true
  });
  const geo = new THREE.PlaneGeometry(scale, scale);
  const mesh = new THREE.Mesh(geo, material);
  const y = terrainHeightCached(x, z);
  mesh.position.set(x, y + scale * 0.4, z);
  spriteGroup.add(mesh);
  return mesh;
}

const treeTex = await loadSprite('IMG_2075.png');
const rockTex = await loadSprite('IMG_2073.png');
const bushTex = await loadSprite('IMG_2082.png');
const pineTex = await loadSprite('IMG_2088.png');
const mapleTex = await loadSprite('IMG_2097.png');

function placeTreeCluster(tex, cx, cz, count) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const rad = Math.random() * 5;
    const x = cx + Math.cos(ang) * rad;
    const z = cz + Math.sin(ang) * rad;
    const s = 2.6 + Math.random() * 1.0;
    placeSprite(tex, x, z, s);
  }
}

placeTreeCluster(treeTex, -18, -18, 7);
placeTreeCluster(treeTex, 20, -12, 6);
placeTreeCluster(treeTex, -10, 20, 8);
placeTreeCluster(pineTex, 22, 18, 5);
placeTreeCluster(treeTex, -28, 2, 6);
placeTreeCluster(pineTex, 5, -28, 5);
placeTreeCluster(mapleTex, -2, 8, 4);
placeTreeCluster(treeTex, 15, 3, 4);
placeTreeCluster(mapleTex, -22, -8, 4);

for (let i = 0; i < 8; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rad = 15 + Math.random() * 25;
  placeSprite(rockTex, Math.cos(ang) * rad, Math.sin(ang) * rad, 1.8 + Math.random() * 0.8);
}
for (let i = 0; i < 12; i++) {
  const ang = Math.random() * Math.PI * 2;
  const rad = 10 + Math.random() * 30;
  placeSprite(bushTex, Math.cos(ang) * rad, Math.sin(ang) * rad, 1.6 + Math.random() * 0.6);
}

const playerGroup = new THREE.Group();

const playerShadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.55, 16),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false })
);
playerShadow.rotation.x = -Math.PI / 2;
playerShadow.position.y = 0.05;
playerGroup.add(playerShadow);

const playerBody = new THREE.Mesh(
  new THREE.PlaneGeometry(1.0, 1.6),
  new THREE.MeshBasicMaterial({ color: 0xff3366, transparent: true, side: THREE.DoubleSide })
);
playerBody.position.y = 0.85;
playerGroup.add(playerBody);

scene.add(playerGroup);

const camPos = new THREE.Vector3();
const camTarget = new THREE.Vector3();
const camSmoothPos = new THREE.Vector3();
const camSmoothTarget = new THREE.Vector3(0, 0, 0);

function updateCamera(instant) {
  const py = terrainHeightCached(playerGroup.position.x, playerGroup.position.z);
  camTarget.set(playerGroup.position.x, py + 1.2, playerGroup.position.z);
  camPos.set(
    playerGroup.position.x,
    py + camY,
    playerGroup.position.z + camZ
  );

  if (instant) {
    camSmoothPos.copy(camPos);
    camSmoothTarget.copy(camTarget);
  } else {
    camSmoothPos.lerp(camPos, 0.08);
    camSmoothTarget.lerp(camTarget, 0.1);
  }

  camera.position.copy(camSmoothPos);
  camera.lookAt(camSmoothTarget);

  skyMesh.position.copy(camera.position);

  spriteGroup.children.forEach(function(s) {
    s.quaternion.copy(camera.quaternion);
  });
  playerBody.quaternion.copy(camera.quaternion);
  playerGroup.position.y = terrainHeightCached(playerGroup.position.x, playerGroup.position.z);
}
updateCamera(true);

let pinchDist = 0;
let pinchStartFov = 38;
const el = renderer.domElement;

el.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    pinchStartFov = camera.fov;
  }
}, { passive: false });

el.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) {
      const ratio = d / pinchDist;
      camera.fov = Math.max(20, Math.min(60, pinchStartFov / ratio));
      camera.updateProjectionMatrix();
    }
  }
}, { passive: false });

el.addEventListener('touchend', function() {
  pinchDist = 0;
}, { passive: false });

const joy = document.getElementById('joy');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false;
let joyTouchId = null;
let joyCenterX = 0;
let joyCenterY = 0;
let joyVecX = 0;
let joyVecY = 0;

function joyRect() {
  const r = joy.getBoundingClientRect();
  joyCenterX = r.left + r.width / 2;
  joyCenterY = r.top + r.height / 2;
}

joy.addEventListener('touchstart', function(e) {
  e.preventDefault();
  e.stopPropagation();
  if (joyActive) return;
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyActive = true;
  joyRect();
  handleJoyMove(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (!joyActive) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === joyTouchId) {
      e.preventDefault();
      handleJoyMove(t.clientX, t.clientY);
    }
  }
}, { passive: false });

document.addEventListener('touchend', function(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === joyTouchId) {
      joyActive = false;
      joyTouchId = null;
      joyVecX = 0;
      joyVecY = 0;
      joyKnob.style.transform = 'translate(-50%, -50%)';
    }
  }
}, { passive: false });

function handleJoyMove(cx, cy) {
  let dx = cx - joyCenterX;
  let dy = cy - joyCenterY;
  const maxR = 55;
  const d = Math.hypot(dx, dy);
  if (d > maxR) {
    dx = dx / d * maxR;
    dy = dy / d * maxR;
  }
  joyVecX = dx / maxR;
  joyVecY = dy / maxR;
  joyKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
}

const playerSpeed = 7.0;

let frames = 0;
let lastFpsT = performance.now();
let lastT = performance.now();

function animate() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (Math.abs(joyVecX) > 0.05 || Math.abs(joyVecY) > 0.05) {
    playerGroup.position.x += joyVecX * playerSpeed * dt;
    playerGroup.position.z += joyVecY * playerSpeed * dt;
    const lim = WORLD_SIZE * 0.45;
    playerGroup.position.x = Math.max(-lim, Math.min(lim, playerGroup.position.x));
    playerGroup.position.z = Math.max(-lim, Math.min(lim, playerGroup.position.z));
  }

  cloudGroup.children.forEach(function(cloud) {
    cloud.position.x += cloud.userData.speed * dt;
    if (cloud.position.x > 150) cloud.position.x = -150;
    cloud.quaternion.copy(camera.quaternion);
  });

// ... input handling ...
    // ... player movement ...

    // ============ TEMPEL DI SINI ============
    virtualTimeSky += dt;
    const timeOfDay = (virtualTimeSky % DAY_DURATION) / DAY_DURATION;
    const sunAngle = timeOfDay * Math.PI * 2 - Math.PI / 2;
    const sunElev = Math.sin(sunAngle);
    const dayF = Math.max(0, Math.min(1, (sunElev + 0.15) * 2.5));

    sunSprite.position.set(
      playerGroup.position.x + Math.cos(sunAngle) * 200,
      playerGroup.position.y + sunElev * 200,
      playerGroup.position.z + 30
    );
    sunSprite.quaternion.copy(camera.quaternion);
    sunSprite.visible = sunElev > -0.15;

    moonSprite.position.set(
      playerGroup.position.x - Math.cos(sunAngle) * 200,
      playerGroup.position.y - sunElev * 200,
      playerGroup.position.z - 30
    );
    moonSprite.quaternion.copy(camera.quaternion);
    moonSprite.visible = -sunElev > -0.15;

    skyMesh.position.copy(camera.position);

    skyMat.color.setRGB(
      0.15 + dayF * 0.85,
      0.18 + dayF * 0.82,
      0.30 + dayF * 0.70
    );

    const bgR = 0.05 + dayF * 0.60;
    const bgG = 0.08 + dayF * 0.56;
    const bgB = 0.20 + dayF * 0.44;
    scene.background.setRGB(bgR, bgG, bgB);
    scene.fog.color.setRGB(bgR, bgG, bgB);

    starMat.opacity = Math.max(0, Math.min(1, -sunElev * 3 + 0.15));

    cloudPlane.position.x = playerGroup.position.x;
    cloudPlane.position.z = playerGroup.position.z;
    cloudTex.offset.x += dt * 0.004;
    cloudTex.offset.y += dt * 0.0015;
    cloudMat.opacity = 0.35 + dayF * 0.35;

    sun.intensity = 0.3 + dayF * 2.2;
    sun.position.set(
      playerGroup.position.x + Math.cos(sunAngle) * 40,
      playerGroup.position.y + Math.max(10, sunElev * 80 + 20),
      playerGroup.position.z + 30
    );
    // ============ SAMPAI SINI ============

    updateCamera(false);
renderer.render(scene, camera);
  renderer.render(scene, camera);
  frames++;

  if (now - lastFpsT > 500) {
    const fps = Math.round(frames * 1000 / (now - lastFpsT));
    hudFps.textContent = fps + ' FPS';
    frames = 0;
    lastFpsT = now;
  }
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', function() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
