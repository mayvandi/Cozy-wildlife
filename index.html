<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cozy Wildlife</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 16px; left: 16px;
    color: #fff; font-size: 11px; font-family: ui-monospace, monospace;
    background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 10px;
    z-index: 10; pointer-events: none; line-height: 1.6; }
  .ok { color: #7dfba7; }
  .clock { color: #ffdd88; font-weight: 700; }
  #joy { position: fixed; left: 30px; bottom: 40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.35);
    z-index: 5; touch-action: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%;
    width: 55px; height: 55px; border-radius: 50%;
    background: rgba(255,255,255,0.5);
    border: 2px solid rgba(255,255,255,0.7);
    transform: translate(-50%, -50%);
    pointer-events: none; }
</style>
</head>
<body>
<div id="hud">
  <div id="rnd">Init...</div>
  <div id="fps">-- FPS</div>
  <div id="clock" class="clock">--:--</div>
</div>
<div id="joy"><div id="joyKnob"></div></div>

<script type="importmap">
{
  "imports": {
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three/webgpu';

const hudRnd = document.getElementById('rnd');
const hudFps = document.getElementById('fps');
const hudClock = document.getElementById('clock');

const texLoader = new THREE.TextureLoader();
async function loadSprite(path) {
  const tex = await texLoader.loadAsync(path);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = false;
  return tex;
}

let renderer;
try {
  renderer = new THREE.WebGPURenderer({ antialias: false, alpha: false });
  await renderer.init();
} catch (e) {
  hudRnd.innerHTML = 'GAGAL: ' + e.message;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.touchAction = 'none';

hudRnd.innerHTML = 'Renderer: <span class="ok">WebGPU</span>';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8d0e8);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
scene.add(ambientLight);

const sun = new THREE.DirectionalLight(0xfff0dd, 1.8);
sun.position.set(20, 40, 20);
scene.add(sun);

const hemiLight = new THREE.HemisphereLight(0xbfd8e8, 0x5a6a3a, 0.5);
scene.add(hemiLight);

function hash2(x, y) {
  const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return n - Math.floor(n);
}
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, oct) {
  oct = oct || 4;
  let v = 0, a = 1, f = 1, total = 0;
  for (let i = 0; i < oct; i++) {
    v += a * valueNoise(x * f, y * f);
    total += a;
    f *= 2.03;
    a *= 0.5;
  }
  return v / total;
}

const MAP_SIZE = 60;
const TILE_TYPES = 3;

const tiles = new Uint8Array(MAP_SIZE * MAP_SIZE);
for (let z = 0; z < MAP_SIZE; z++) {
  for (let x = 0; x < MAP_SIZE; x++) {
    const n1 = fbm(x * 0.08 + 30, z * 0.08 + 30, 4);
    const n2 = valueNoise(x * 0.15 + 500, z * 0.15 + 500);
    let n = n1 * 0.7 + n2 * 0.3;
    let t = 0;
    if (n > 0.55) t = 0;
    else if (n > 0.42) t = 1;
    else t = 2;
    tiles[z * MAP_SIZE + x] = t;
  }
}

const tileColors = [0x7ab04a, 0x8a6a3a, 0x4a90c8];

const positions = [];
const tileColorsArr = [];
const indices = [];

for (let z = 0; z < MAP_SIZE; z++) {
  for (let x = 0; x < MAP_SIZE; x++) {
    const t = tiles[z * MAP_SIZE + x];
    const baseColor = new THREE.Color(tileColors[t]);
    const variation = (valueNoise(x * 2.3, z * 1.7) - 0.5) * 0.10;
    const r = Math.max(0, Math.min(1, baseColor.r + variation));
    const g = Math.max(0, Math.min(1, baseColor.g + variation));
    const b = Math.max(0, Math.min(1, baseColor.b + variation));

    const wx = x - MAP_SIZE / 2;
    const wz = z - MAP_SIZE / 2;
    const v0 = positions.length / 3;

    positions.push(
      wx, 0, wz,
      wx + 1, 0, wz,
      wx + 1, 0, wz + 1,
      wx, 0, wz + 1
    );
    for (let i = 0; i < 4; i++) {
      tileColorsArr.push(r, g, b);
    }
    indices.push(v0, v0 + 1, v0 + 2, v0, v0 + 2, v0 + 3);
  }
}

const tileGeo = new THREE.BufferGeometry();
tileGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
tileGeo.setAttribute('color', new THREE.Float32BufferAttribute(tileColorsArr, 3));
tileGeo.setIndex(indices);
tileGeo.computeVertexNormals();

const tileMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const tileMesh = new THREE.Mesh(tileGeo, tileMat);
scene.add(tileMesh);

function isWaterAt(wx, wz) {
  const gx = Math.floor(wx + MAP_SIZE / 2);
  const gz = Math.floor(wz + MAP_SIZE / 2);
  if (gx < 0 || gx >= MAP_SIZE || gz < 0 || gz >= MAP_SIZE) return true;
  return tiles[gz * MAP_SIZE + gx] === 2;
}

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 500);
const FRUSTUM_SIZE = 22;
function updateCameraProjection() {
  const aspect = innerWidth / innerHeight;
  camera.left = -FRUSTUM_SIZE * aspect / 2;
  camera.right = FRUSTUM_SIZE * aspect / 2;
  camera.top = FRUSTUM_SIZE / 2;
  camera.bottom = -FRUSTUM_SIZE / 2;
  camera.updateProjectionMatrix();
}
updateCameraProjection();

const CAM_HEIGHT = 30;
const CAM_DEPTH = 12;

const spriteGroup = new THREE.Group();
scene.add(spriteGroup);

function placeSprite(tex, x, z, scale) {
  if (isWaterAt(x, z)) return null;
  const material = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    alphaTest: 0.5,
    side: THREE.DoubleSide,
    depthWrite: true
  });
  const geo = new THREE.PlaneGeometry(scale, scale);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, scale * 0.5, z);
  spriteGroup.add(mesh);
  return mesh;
}

const treeTex = await loadSprite('IMG_2075.png');
const rockTex = await loadSprite('IMG_2073.png');
const bushTex = await loadSprite('IMG_2082.png');
const pineTex = await loadSprite('IMG_2088.png');
const mapleTex = await loadSprite('IMG_2097.png');

function placeTreeCluster(tex, cx, cz, count, size) {
  for (let i = 0; i < count; i++) {
    for (let attempt = 0; attempt < 10; attempt++) {
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.random() * 4;
      const x = cx + Math.cos(ang) * rad;
      const z = cz + Math.sin(ang) * rad;
      if (!isWaterAt(x, z)) {
        const s = size * (0.85 + Math.random() * 0.3);
        placeSprite(tex, x, z, s);
        break;
      }
    }
  }
}

placeTreeCluster(treeTex, -18, -18, 6, 2.8);
placeTreeCluster(treeTex, 18, -12, 5, 2.8);
placeTreeCluster(treeTex, -10, 18, 7, 2.8);
placeTreeCluster(pineTex, 20, 16, 5, 2.8);
placeTreeCluster(treeTex, -24, 2, 5, 2.8);
placeTreeCluster(pineTex, 5, -22, 5, 2.8);
placeTreeCluster(mapleTex, -2, 8, 4, 2.8);
placeTreeCluster(treeTex, 14, 3, 4, 2.8);
placeTreeCluster(mapleTex, -20, -8, 4, 2.8);

for (let i = 0; i < 12; i++) {
  for (let attempt = 0; attempt < 10; attempt++) {
    const ang = Math.random() * Math.PI * 2;
    const rad = 8 + Math.random() * 20;
    const x = Math.cos(ang) * rad;
    const z = Math.sin(ang) * rad;
    if (!isWaterAt(x, z)) {
      placeSprite(rockTex, x, z, 1.6 + Math.random() * 0.6);
      break;
    }
  }
}

for (let i = 0; i < 20; i++) {
  for (let attempt = 0; attempt < 10; attempt++) {
    const ang = Math.random() * Math.PI * 2;
    const rad = 5 + Math.random() * 25;
    const x = Math.cos(ang) * rad;
    const z = Math.sin(ang) * rad;
    if (!isWaterAt(x, z)) {
      placeSprite(bushTex, x, z, 1.4 + Math.random() * 0.5);
      break;
    }
  }
}

const playerGroup = new THREE.Group();

const playerShadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.45, 16),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false })
);
playerShadow.rotation.x = -Math.PI / 2;
playerShadow.position.y = 0.05;
playerGroup.add(playerShadow);

const playerBody = new THREE.Mesh(
  new THREE.PlaneGeometry(1.0, 1.4),
  new THREE.MeshBasicMaterial({ color: 0xff3366, transparent: true, side: THREE.DoubleSide })
);
playerBody.position.y = 0.7;
playerGroup.add(playerBody);

scene.add(playerGroup);

const camPos = new THREE.Vector3();
const camTarget = new THREE.Vector3();
const camSmoothPos = new THREE.Vector3();
const camSmoothTarget = new THREE.Vector3(0, 0, 0);

function updateCamera(instant) {
  camTarget.set(playerGroup.position.x, 0, playerGroup.position.z);
  camPos.set(
    playerGroup.position.x,
    CAM_HEIGHT,
    playerGroup.position.z + CAM_DEPTH
  );

  if (instant) {
    camSmoothPos.copy(camPos);
    camSmoothTarget.copy(camTarget);
  } else {
    camSmoothPos.lerp(camPos, 0.10);
    camSmoothTarget.lerp(camTarget, 0.12);
  }

  camera.position.copy(camSmoothPos);
  camera.lookAt(camSmoothTarget);

  spriteGroup.children.forEach(function(s) {
    s.quaternion.copy(camera.quaternion);
  });
  playerBody.quaternion.copy(camera.quaternion);
}
updateCamera(true);

let pinchDist = 0;
let pinchStartFrustum = FRUSTUM_SIZE;
let currentFrustum = FRUSTUM_SIZE;
const el = renderer.domElement;

el.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    pinchStartFrustum = currentFrustum;
  }
}, { passive: false });

el.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) {
      const ratio = d / pinchDist;
      currentFrustum = Math.max(10, Math.min(40, pinchStartFrustum / ratio));
      const aspect = innerWidth / innerHeight;
      camera.left = -currentFrustum * aspect / 2;
      camera.right = currentFrustum * aspect / 2;
      camera.top = currentFrustum / 2;
      camera.bottom = -currentFrustum / 2;
      camera.updateProjectionMatrix();
    }
  }
}, { passive: false });

el.addEventListener('touchend', function() {
  pinchDist = 0;
}, { passive: false });

const joy = document.getElementById('joy');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false;
let joyTouchId = null;
let joyCenterX = 0;
let joyCenterY = 0;
let joyVecX = 0;
let joyVecY = 0;

function joyRect() {
  const r = joy.getBoundingClientRect();
  joyCenterX = r.left + r.width / 2;
  joyCenterY = r.top + r.height / 2;
}

joy.addEventListener('touchstart', function(e) {
  e.preventDefault();
  e.stopPropagation();
  if (joyActive) return;
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyActive = true;
  joyRect();
  handleJoyMove(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (!joyActive) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === joyTouchId) {
      e.preventDefault();
      handleJoyMove(t.clientX, t.clientY);
    }
  }
}, { passive: false });

document.addEventListener('touchend', function(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === joyTouchId) {
      joyActive = false;
      joyTouchId = null;
      joyVecX = 0;
      joyVecY = 0;
      joyKnob.style.transform = 'translate(-50%, -50%)';
    }
  }
}, { passive: false });

function handleJoyMove(cx, cy) {
  let dx = cx - joyCenterX;
  let dy = cy - joyCenterY;
  const maxR = 55;
  const d = Math.hypot(dx, dy);
  if (d > maxR) {
    dx = dx / d * maxR;
    dy = dy / d * maxR;
  }
  joyVecX = dx / maxR;
  joyVecY = dy / maxR;
  joyKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
}

const playerSpeed = 6.0;
const PLAYER_RADIUS = 0.4;

let virtualTimeSky = 0;
const DAY_DURATION = 240.0;

let frames = 0;
let lastFpsT = performance.now();
let lastT = performance.now();
let lastClockT = 0;

function animate() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (Math.abs(joyVecX) > 0.05 || Math.abs(joyVecY) > 0.05) {
    const nx = playerGroup.position.x + joyVecX * playerSpeed * dt;
    const nz = playerGroup.position.z + joyVecY * playerSpeed * dt;

    if (!isWaterAt(nx + PLAYER_RADIUS * Math.sign(joyVecX || 1), playerGroup.position.z)) {
      playerGroup.position.x = nx;
    }
    if (!isWaterAt(playerGroup.position.x, nz + PLAYER_RADIUS * Math.sign(joyVecY || 1))) {
      playerGroup.position.z = nz;
    }

    const lim = MAP_SIZE / 2 - 2;
    playerGroup.position.x = Math.max(-lim, Math.min(lim, playerGroup.position.x));
    playerGroup.position.z = Math.max(-lim, Math.min(lim, playerGroup.position.z));

    if (Math.abs(joyVecX) > 0.15) {
      playerBody.scale.x = joyVecX > 0 ? 1 : -1;
    }
  }

  virtualTimeSky += dt;
  const timeOfDay = (virtualTimeSky % DAY_DURATION) / DAY_DURATION;
  const sunAngle = timeOfDay * Math.PI * 2 - Math.PI / 2;
  const sunElev = Math.sin(sunAngle);
  const dayF = Math.max(0, Math.min(1, (sunElev + 0.1) * 3.0));
  const sunsetF = Math.max(0, 1.0 - Math.abs(sunElev) * 3.5);

  if (now - lastClockT > 500) {
    lastClockT = now;
    const hours24 = timeOfDay * 24;
    const hh = Math.floor(hours24);
    const mm = Math.floor((hours24 - hh) * 60);
    let label = 'Malam';
    if (hh >= 5 && hh < 11) label = 'Pagi';
    else if (hh >= 11 && hh < 15) label = 'Siang';
    else if (hh >= 15 && hh < 18) label = 'Sore';
    const padH = (hh < 10 ? '0' : '') + hh;
    const padM = (mm < 10 ? '0' : '') + mm;
    hudClock.textContent = label + ' ' + padH + ':' + padM;
  }

  const ambientR = 0.15 + dayF * 0.85 + sunsetF * 0.30;
  const ambientG = 0.15 + dayF * 0.85 + sunsetF * 0.15;
  const ambientB = 0.25 + dayF * 0.75 - sunsetF * 0.05;
  ambientLight.color.setRGB(ambientR, ambientG, ambientB);
  ambientLight.intensity = 0.35 + dayF * 0.85;

  sun.intensity = 0.3 + dayF * 1.5;
  sun.color.setRGB(
    0.8 + sunsetF * 0.2,
    0.85 - sunsetF * 0.15,
    0.75 - sunsetF * 0.35
  );

  hemiLight.intensity = 0.15 + dayF * 0.4;

  const bgR = 0.02 + dayF * 0.63 + sunsetF * 0.45;
  const bgG = 0.03 + dayF * 0.78 + sunsetF * 0.15;
  const bgB = 0.08 + dayF * 0.83 - sunsetF * 0.05;
  scene.background.setRGB(bgR, bgG, bgB);

  updateCamera(false);
  renderer.render(scene, camera);
  frames++;

  if (now - lastFpsT > 500) {
    const fps = Math.round(frames * 1000 / (now - lastFpsT));
    hudFps.textContent = fps + ' FPS';
    frames = 0;
    lastFpsT = now;
  }
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', function() {
  updateCameraProjection();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
