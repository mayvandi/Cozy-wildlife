<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sprite Test - 2.5D Isometric</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #b8d8e8;
    font-family: -apple-system, system-ui, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 16px; left: 16px;
    color: #fff; font-size: 11px; font-family: ui-monospace, monospace;
    background: rgba(0,0,0,0.45); padding: 8px 12px; border-radius: 10px;
    z-index: 10; pointer-events: none; line-height: 1.6;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .ok { color: #7dfba7; } .warn { color: #ffcc44; } .err { color: #ff7788; }
</style>
</head>
<body>
<div id="hud">
  <div id="rnd">Init...</div>
  <div id="fps">-- FPS</div>
  <div id="info">--</div>
</div>

<script type="importmap">
{
  "imports": {
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three/webgpu';

const hudRnd = document.getElementById('rnd');
const texLoader = new THREE.TextureLoader();
async function loadSprite(path) {
  const tex = await texLoader.loadAsync(path);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = false;
  return tex;
  }
const hudFps = document.getElementById('fps');
const hudInfo = document.getElementById('info');

let renderer;
try {
  renderer = new THREE.WebGPURenderer({ antialias: false, alpha: false });
  await renderer.init();
} catch (e) {
  hudRnd.innerHTML = 'Renderer GAGAL: ' + e.message;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

hudRnd.innerHTML = 'Renderer: <span class="ok">WebGPU</span>';

const scene = new THREE.Scene();
const skyColor = 0xb8d8e8;
scene.background = new THREE.Color(skyColor);
scene.fog = new THREE.Fog(skyColor, 35, 90);

const sun = new THREE.DirectionalLight(0xfff0dd, 2.4);
sun.position.set(40, 60, 30);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xa8c8e0, 0.7));
scene.add(new THREE.HemisphereLight(0xbfd8e8, 0x4a5a3a, 0.5));

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

function makeTextureFromCanvas(c) {
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = false;
  return tex;
}

function makeTreeSprite() {
  const c = makeCanvas(32, 32);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 32, 32);
  ctx.fillStyle = '#6a4a30';
  ctx.fillRect(14, 20, 4, 12);
  ctx.fillStyle = '#4a3420';
  ctx.fillRect(17, 20, 1, 12);
  ctx.fillStyle = '#3a6a2a';
  ctx.fillRect(4, 16, 24, 6);
  ctx.fillStyle = '#4a7a3a';
  ctx.fillRect(6, 12, 20, 6);
  ctx.fillStyle = '#5a8a4a';
  ctx.fillRect(8, 8, 16, 6);
  ctx.fillStyle = '#6a9a5a';
  ctx.fillRect(10, 4, 12, 6);
  ctx.fillStyle = '#7aaa6a';
  ctx.fillRect(10, 4, 6, 2);
  ctx.fillRect(8, 8, 4, 2);
  ctx.fillRect(6, 12, 4, 2);
  return makeTextureFromCanvas(c);
}

function makeRockSprite() {
  const c = makeCanvas(32, 32);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 32, 32);
  ctx.fillStyle = '#7a7268';
  ctx.fillRect(8, 18, 16, 10);
  ctx.fillRect(6, 20, 20, 6);
  ctx.fillRect(10, 14, 12, 6);
  ctx.fillStyle = '#9a9288';
  ctx.fillRect(10, 14, 8, 2);
  ctx.fillRect(8, 18, 8, 2);
  ctx.fillStyle = '#5a5448';
  ctx.fillRect(8, 26, 16, 2);
  ctx.fillRect(6, 24, 20, 2);
  ctx.fillStyle = '#3a3428';
  ctx.fillRect(14, 20, 1, 4);
  ctx.fillRect(20, 22, 1, 3);
  return makeTextureFromCanvas(c);
}

function makeGrassSprite() {
  const c = makeCanvas(16, 16);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 16, 16);
  ctx.fillStyle = '#6a9a4a';
  ctx.fillRect(4, 8, 1, 6);
  ctx.fillRect(7, 6, 1, 8);
  ctx.fillRect(10, 9, 1, 5);
  ctx.fillStyle = '#5a8a3a';
  ctx.fillRect(5, 10, 1, 4);
  ctx.fillRect(9, 8, 1, 6);
  ctx.fillStyle = '#7aaa5a';
  ctx.fillRect(6, 7, 1, 3);
  ctx.fillRect(8, 5, 1, 3);
  return makeTextureFromCanvas(c);
}

function makeBushSprite() {
  const c = makeCanvas(32, 32);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 32, 32);
  ctx.fillStyle = '#4a7a3a';
  ctx.fillRect(6, 18, 20, 10);
  ctx.fillRect(8, 14, 16, 6);
  ctx.fillStyle = '#5a8a4a';
  ctx.fillRect(10, 12, 12, 6);
  ctx.fillStyle = '#6a9a5a';
  ctx.fillRect(12, 10, 8, 4);
  ctx.fillStyle = '#7aaa6a';
  ctx.fillRect(12, 10, 4, 2);
  return makeTextureFromCanvas(c);
}

const groundGeo = new THREE.PlaneGeometry(60, 60);
groundGeo.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x88a860 });
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);

const frustumSize = 18;
const aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2, frustumSize * aspect / 2,
  frustumSize / 2, -frustumSize / 2,
  0.1, 500
);

const isoAngle = Math.atan(1 / Math.sqrt(2));
const cameraDist = 80;
const cameraYaw = Math.PI * 0.25;
camera.position.set(
  cameraDist * Math.cos(isoAngle) * Math.sin(cameraYaw),
  cameraDist * Math.sin(isoAngle),
  cameraDist * Math.cos(isoAngle) * Math.cos(cameraYaw)
);
camera.lookAt(0, 0, 0);

const spriteGroup = new THREE.Group();
scene.add(spriteGroup);

function placeSprite(tex, x, z, scale) {
  const material = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    alphaTest: 0.5,
    side: THREE.DoubleSide,
    depthWrite: true
  });
  const geo = new THREE.PlaneGeometry(scale, scale);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, scale * 0.5, z);
  mesh.quaternion.copy(camera.quaternion);
  spriteGroup.add(mesh);
  return mesh;
}

const treeTex = await loadSprite('IMG_2075.png');
const rockTex = makeRockSprite();
const grassTex = makeGrassSprite();
const bushTex = makeBushSprite();

placeSprite(treeTex, -6, -6, 3.0);
placeSprite(treeTex, 8, -4, 2.8);
placeSprite(treeTex, -10, 6, 3.2);
placeSprite(treeTex, 6, 10, 2.7);
placeSprite(treeTex, -2, -10, 2.9);

placeSprite(rockTex, 4, 4, 2.0);
placeSprite(rockTex, -8, -2, 1.8);
placeSprite(rockTex, 12, 2, 2.2);

placeSprite(bushTex, 2, -8, 2.0);
placeSprite(bushTex, -12, 2, 1.8);
placeSprite(bushTex, 10, 8, 2.1);
placeSprite(bushTex, -4, 12, 1.9);

placeSprite(grassTex, -5, 5, 1.2);
placeSprite(grassTex, 3, 3, 1.0);
placeSprite(grassTex, -3, -3, 1.1);
placeSprite(grassTex, 7, -7, 1.0);
placeSprite(grassTex, -7, 7, 1.1);

const playerGeo = new THREE.PlaneGeometry(0.6, 0.6);
const playerMat = new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide });
const player = new THREE.Mesh(playerGeo, playerMat);
player.rotation.x = -Math.PI / 2;
player.position.set(0, 0.05, 0);
scene.add(player);

let pinchDist = 0;
let pinchStartZoom = 1;
const el = renderer.domElement;

el.addEventListener('touchstart', function(e) {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    pinchStartZoom = camera.zoom;
  }
}, { passive: true });

el.addEventListener('touchmove', function(e) {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) {
      const ratio = d / pinchDist;
      camera.zoom = Math.max(0.5, Math.min(4.0, pinchStartZoom * ratio));
      camera.updateProjectionMatrix();
    }
  }
}, { passive: true });

el.addEventListener('touchend', function() {
  pinchDist = 0;
}, { passive: true });

el.addEventListener('wheel', function(e) {
  camera.zoom = Math.max(0.5, Math.min(4.0, camera.zoom * (1 - e.deltaY * 0.001)));
  camera.updateProjectionMatrix();
}, { passive: true });

addEventListener('resize', function() {
  const w = innerWidth, h = innerHeight, a = w / h;
  camera.left = -frustumSize * a / 2;
  camera.right = frustumSize * a / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

let frames = 0;
let lastFpsT = performance.now();

function animate() {
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - lastFpsT > 500) {
    const fps = Math.round(frames * 1000 / (now - lastFpsT));
    hudFps.textContent = fps + ' FPS';
    hudInfo.textContent = 'zoom ' + camera.zoom.toFixed(2) + ' . sprites ' + spriteGroup.children.length;
    frames = 0;
    lastFpsT = now;
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
