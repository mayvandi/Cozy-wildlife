<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Octopath Test - Cozy Wildlife</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #b8d8e8;
    font-family: -apple-system, system-ui, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 16px; left: 16px;
    color: #fff; font-size: 11px; font-family: ui-monospace, monospace;
    background: rgba(0,0,0,0.45); padding: 8px 12px; border-radius: 10px;
    z-index: 10; pointer-events: none; line-height: 1.6;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .ok { color: #7dfba7; }
  #joy { position: fixed; left: 30px; bottom: 40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.35);
    z-index: 5; touch-action: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%;
    width: 55px; height: 55px; border-radius: 50%;
    background: rgba(255,255,255,0.5);
    border: 2px solid rgba(255,255,255,0.7);
    transform: translate(-50%, -50%);
    pointer-events: none; }
</style>
</head>
<body>
<div id="hud">
  <div id="rnd">Init...</div>
  <div id="fps">-- FPS</div>
  <div id="info">--</div>
</div>
<div id="joy"><div id="joyKnob"></div></div>

<script type="importmap">
{
  "imports": {
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three/webgpu';

const hudRnd = document.getElementById('rnd');
const hudFps = document.getElementById('fps');
const hudInfo = document.getElementById('info');

const texLoader = new THREE.TextureLoader();
async function loadSprite(path) {
  const tex = await texLoader.loadAsync(path);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = false;
  return tex;
}

let renderer;
try {
  renderer = new THREE.WebGPURenderer({ antialias: false, alpha: false });
  await renderer.init();
} catch (e) {
  hudRnd.innerHTML = 'Renderer GAGAL: ' + e.message;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.touchAction = 'none';

hudRnd.innerHTML = 'Renderer: <span class="ok">WebGPU</span>';

const scene = new THREE.Scene();
const skyColor = 0xb8d8e8;
scene.background = new THREE.Color(skyColor);

const sun = new THREE.DirectionalLight(0xfff0dd, 2.4);
sun.position.set(40, 60, 30);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xa8c8e0, 0.7));
scene.add(new THREE.HemisphereLight(0xbfd8e8, 0x4a5a3a, 0.5));

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

function makeTextureFromCanvas(c) {
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = false;
  return tex;
}

function makeRockSprite() {
  const c = makeCanvas(32, 32);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 32, 32);
  ctx.fillStyle = '#7a7268';
  ctx.fillRect(8, 18, 16, 10);
  ctx.fillRect(6, 20, 20, 6);
  ctx.fillRect(10, 14, 12, 6);
  ctx.fillStyle = '#9a9288';
  ctx.fillRect(10, 14, 8, 2);
  ctx.fillRect(8, 18, 8, 2);
  ctx.fillStyle = '#5a5448';
  ctx.fillRect(8, 26, 16, 2);
  ctx.fillRect(6, 24, 20, 2);
  return makeTextureFromCanvas(c);
}

function makeGrassSprite() {
  const c = makeCanvas(16, 16);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 16, 16);
  ctx.fillStyle = '#6a9a4a';
  ctx.fillRect(4, 8, 1, 6);
  ctx.fillRect(7, 6, 1, 8);
  ctx.fillRect(10, 9, 1, 5);
  ctx.fillStyle = '#5a8a3a';
  ctx.fillRect(5, 10, 1, 4);
  ctx.fillRect(9, 8, 1, 6);
  ctx.fillStyle = '#7aaa5a';
  ctx.fillRect(6, 7, 1, 3);
  ctx.fillRect(8, 5, 1, 3);
  return makeTextureFromCanvas(c);
}

function makeBushSprite() {
  const c = makeCanvas(32, 32);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 32, 32);
  ctx.fillStyle = '#4a7a3a';
  ctx.fillRect(6, 18, 20, 10);
  ctx.fillRect(8, 14, 16, 6);
  ctx.fillStyle = '#5a8a4a';
  ctx.fillRect(10, 12, 12, 6);
  ctx.fillStyle = '#6a9a5a';
  ctx.fillRect(12, 10, 8, 4);
  ctx.fillStyle = '#7aaa6a';
  ctx.fillRect(12, 10, 4, 2);
  return makeTextureFromCanvas(c);
}

const groundGeo = new THREE.PlaneGeometry(400, 400);
groundGeo.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x88a860 });
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);

const frustumSize = 14;
const aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2, frustumSize * aspect / 2,
  frustumSize / 2, -frustumSize / 2,
  0.1, 1000
);

const camAngle = Math.PI / 4.5;
const camDist = 100;
const camHeight = camDist * Math.sin(camAngle);
const camHoriz = camDist * Math.cos(camAngle);

const spriteGroup = new THREE.Group();
scene.add(spriteGroup);

function placeSprite(tex, x, z, scale) {
  const material = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    alphaTest: 0.5,
    side: THREE.DoubleSide,
    depthWrite: true
  });
  const geo = new THREE.PlaneGeometry(scale, scale);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, scale * 0.5, z);
  mesh.userData.isSprite = true;
  spriteGroup.add(mesh);
  return mesh;
}

const treeTex = await loadSprite('IMG_2075.png');
const rockTex = makeRockSprite();
const grassTex = makeGrassSprite();
const bushTex = makeBushSprite();

placeSprite(treeTex, -8, -8, 3.5);
placeSprite(treeTex, 10, -6, 3.2);
placeSprite(treeTex, -12, 8, 3.8);
placeSprite(treeTex, 8, 12, 3.0);
placeSprite(treeTex, -3, -14, 3.4);
placeSprite(treeTex, -25, 2, 3.5);
placeSprite(treeTex, 18, -18, 3.2);
placeSprite(treeTex, 28, 6, 3.4);
placeSprite(treeTex, -35, -22, 3.6);

placeSprite(rockTex, 5, 5, 2.2);
placeSprite(rockTex, -10, -3, 2.0);
placeSprite(rockTex, 14, 3, 2.5);
placeSprite(rockTex, -20, 14, 2.2);
placeSprite(rockTex, 24, -10, 2.1);

placeSprite(bushTex, 3, -10, 2.2);
placeSprite(bushTex, -14, 3, 2.0);
placeSprite(bushTex, 12, 10, 2.3);
placeSprite(bushTex, -5, 14, 2.1);
placeSprite(bushTex, 20, 18, 2.2);
placeSprite(bushTex, -28, 6, 2.1);

placeSprite(grassTex, -6, 7, 1.3);
placeSprite(grassTex, 4, 4, 1.1);
placeSprite(grassTex, -4, -5, 1.2);
placeSprite(grassTex, 9, -9, 1.1);
placeSprite(grassTex, -9, 9, 1.2);
placeSprite(grassTex, 14, -14, 1.3);
placeSprite(grassTex, -17, -10, 1.1);
placeSprite(grassTex, 22, 3, 1.2);

const playerGroup = new THREE.Group();

const playerShadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.6, 16),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false })
);
playerShadow.rotation.x = -Math.PI / 2;
playerShadow.position.y = 0.02;
playerGroup.add(playerShadow);

const playerBody = new THREE.Mesh(
  new THREE.PlaneGeometry(1.2, 1.8),
  new THREE.MeshBasicMaterial({ color: 0xff3366, transparent: true, side: THREE.DoubleSide })
);
playerBody.position.y = 0.9;
playerBody.userData.isSprite = true;
playerGroup.add(playerBody);

playerGroup.position.set(0, 0, 0);
scene.add(playerGroup);

const camPos = new THREE.Vector3();
const camTarget = new THREE.Vector3();

function updateCamera() {
  camTarget.copy(playerGroup.position);
  camTarget.y = 1.0;
  camPos.set(
    playerGroup.position.x,
    camHeight,
    playerGroup.position.z + camHoriz
  );
  camera.position.copy(camPos);
  camera.lookAt(camTarget);

  spriteGroup.children.forEach(function(s) {
    s.quaternion.copy(camera.quaternion);
  });
  playerBody.quaternion.copy(camera.quaternion);
}
updateCamera();

let pinchDist = 0;
let pinchStartZoom = 1;
const el = renderer.domElement;

el.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    pinchStartZoom = camera.zoom;
  }
}, { passive: false });

el.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) {
      const ratio = d / pinchDist;
      camera.zoom = Math.max(0.5, Math.min(3.5, pinchStartZoom * ratio));
      camera.updateProjectionMatrix();
    }
  }
}, { passive: false });

el.addEventListener('touchend', function() {
  pinchDist = 0;
}, { passive: false });

const joy = document.getElementById('joy');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false;
let joyTouchId = null;
let joyCenterX = 0;
let joyCenterY = 0;
let joyVecX = 0;
let joyVecY = 0;

function joyRect() {
  const r = joy.getBoundingClientRect();
  joyCenterX = r.left + r.width / 2;
  joyCenterY = r.top + r.height / 2;
}

joy.addEventListener('touchstart', function(e) {
  e.preventDefault();
  e.stopPropagation();
  if (joyActive) return;
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyActive = true;
  joyRect();
  handleJoyMove(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (!joyActive) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === joyTouchId) {
      e.preventDefault();
      handleJoyMove(t.clientX, t.clientY);
    }
  }
}, { passive: false });

document.addEventListener('touchend', function(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === joyTouchId) {
      joyActive = false;
      joyTouchId = null;
      joyVecX = 0;
      joyVecY = 0;
      joyKnob.style.transform = 'translate(-50%, -50%)';
    }
  }
}, { passive: false });

function handleJoyMove(cx, cy) {
  let dx = cx - joyCenterX;
  let dy = cy - joyCenterY;
  const maxR = 55;
  const d = Math.hypot(dx, dy);
  if (d > maxR) {
    dx = dx / d * maxR;
    dy = dy / d * maxR;
  }
  joyVecX = dx / maxR;
  joyVecY = dy / maxR;
  joyKnob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
}

const playerSpeed = 6.0;
let facing = 1;

let frames = 0;
let lastFpsT = performance.now();
let lastT = performance.now();

function animate() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (Math.abs(joyVecX) > 0.05 || Math.abs(joyVecY) > 0.05) {
    const len = Math.hypot(joyVecX, joyVecY);
    const nx = joyVecX / len;
    const ny = joyVecY / len;
    playerGroup.position.x += nx * playerSpeed * dt;
    playerGroup.position.z += ny * playerSpeed * dt;
    if (Math.abs(nx) > 0.15) facing = nx > 0 ? 1 : -1;
  }

  updateCamera();
  renderer.render(scene, camera);
  frames++;

  if (now - lastFpsT > 500) {
    const fps = Math.round(frames * 1000 / (now - lastFpsT));
    hudFps.textContent = fps + ' FPS';
    hudInfo.textContent = 'x ' + playerGroup.position.x.toFixed(1) + ' z ' + playerGroup.position.z.toFixed(1) + ' zoom ' + camera.zoom.toFixed(2);
    frames = 0;
    lastFpsT = now;
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
