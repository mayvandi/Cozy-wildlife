<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cozy Wildlife - M0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #b8d8e8;
    font-family: -apple-system, system-ui, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 16px; left: 16px;
    color: #fff; font-size: 11px; font-family: ui-monospace, monospace;
    background: rgba(0,0,0,0.45); padding: 8px 12px; border-radius: 10px;
    z-index: 10; pointer-events: none; line-height: 1.6;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .ok { color: #7dfba7; } .warn { color: #ffcc44; } .err { color: #ff7788; }
</style>
</head>
<body>
<div id="hud">
  <div id="rnd">Init...</div>
  <div id="fps">-- FPS</div>
  <div id="info">--</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { WebGPURenderer } from 'three/webgpu';

const hud = {
  rnd: document.getElementById('rnd'),
  fps: document.getElementById('fps'),
  info: document.getElementById('info')
};

let renderer;
try {
  renderer = new WebGPURenderer({ antialias: true, alpha: false });
  await renderer.init();
} catch (e) {
  hud.rnd.innerHTML = 'Renderer: <span class="err">GAGAL</span><br>' + e.message;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

let isWebGPU = false;
try {
  isWebGPU = renderer.backend && renderer.backend.isWebGPUBackend === true;
} catch (e) { isWebGPU = false; }
hud.rnd.innerHTML = 'Renderer: <span class="' + (isWebGPU ? 'ok' : 'warn') + '">' + (isWebGPU ? 'WebGPU' : 'WebGL fallback') + '</span>';

const scene = new THREE.Scene();
const skyColor = 0xb8d8e8;
scene.background = new THREE.Color(skyColor);
scene.fog = new THREE.Fog(skyColor, 50, 140);

const sun = new THREE.DirectionalLight(0xfff0dd, 2.4);
sun.position.set(40, 60, 30);
scene.add(sun);

scene.add(new THREE.AmbientLight(0xa8c8e0, 0.7));
scene.add(new THREE.HemisphereLight(0xbfd8e8, 0x4a5a3a, 0.5));

function hash2(x, y) {
  const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return n - Math.floor(n);
}
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, oct) {
  oct = oct || 5;
  let v = 0, a = 1, f = 1, total = 0;
  for (let i = 0; i < oct; i++) {
    v += a * valueNoise(x * f, y * f);
    total += a;
    f *= 2.03;
    a *= 0.5;
  }
  return v / total;
}

const TERRAIN_SIZE = 120;
const TERRAIN_SEG = 128;
const HEIGHT_SCALE = 7;
const EDGE_START = 0.55;
const EDGE_STRENGTH = 14;

const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
terrainGeo.rotateX(-Math.PI / 2);

const pos = terrainGeo.attributes.position;
const colors = new Float32Array(pos.count * 3);

const cSand  = new THREE.Color(0xd8c89a);
const cGrass = new THREE.Color(0x6a8e4a);
const cDirt  = new THREE.Color(0x8a6a4a);
const cRock  = new THREE.Color(0x888888);
const cSnow  = new THREE.Color(0xeaeaea);

function terrainHeight(wx, wz) {
  const nx = wx * 0.035;
  const nz = wz * 0.035;
  let h = fbm(nx + 100, nz + 100) * 2 - 1;
  h = Math.abs(h) * HEIGHT_SCALE;
  const edgeD = Math.max(Math.abs(wx), Math.abs(wz)) / (TERRAIN_SIZE * 0.5);
  const edgeRise = Math.pow(Math.max(0, edgeD - EDGE_START) / (1 - EDGE_START), 2) * EDGE_STRENGTH;
  return h + edgeRise;
}

for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  const h = terrainHeight(x, z);
  pos.setY(i, h);

  let c;
  if (h < 0.8) c = cSand;
  else if (h < 3.5) c = cGrass;
  else if (h < 7) c = cDirt;
  else if (h < 11) c = cRock;
  else c = cSnow;

  const v = (valueNoise(x * 0.4, z * 0.4) - 0.5) * 0.18;
  colors[i * 3]     = Math.max(0, Math.min(1, c.r + v));
  colors[i * 3 + 1] = Math.max(0, Math.min(1, c.g + v));
  colors[i * 3 + 2] = Math.max(0, Math.min(1, c.b + v));
}

terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.92, metalness: 0.0
});
scene.add(new THREE.Mesh(terrainGeo, terrainMat));

function makeTree(x, z, scale) {
  scale = scale || 1;
  const g = new THREE.Group();
  const y = terrainHeight(x, z);

  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3a24, roughness: 1401.0` });
  const leafMat (  = new THREE.MteeshStandardMaterial({ color: 0x4a7a3a, roughness: 0.9, flatShading: true });

  const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.2, 0.5), trunkMat);
  trunk.position.y = 1.1;
  g.add(trunk);

  const sizes = [2.6, 1.9, 1.2];
  for (let i = 0; i < sizes.length; i++) {
    const geo = new THREE.BoxGeometry(sizes[i], sizes[i] * 0.65, sizes[i]);
    const leaf = new THREE.Mesh(geo, leafMat);
    leaf.position.y = 2.8 + i * 0.95;
    leaf.rotation.y = i * 0.7;
    g.add(leaf);
  }

  g.position.set(x, y, z);
  g.scale.setScalar(scale);
  return g;
}

const treeSpots = [
  [-10, -4, 1.0], [6, 7, 1.1], [-5, 9, 0.9], [12, -6, 1.0],
  [-14, 3, 0.85], [8, -12, 1.05], [-3, -14, 0.95], [15, 4, 1.0],
  [-8, 12, 0.9]
];
for (let i = 0; i < treeSpots.length; i++) {
  const t = makeTree(treeSpots[i][0], treeSpots[i][1], treeSpots[i][2]);
  if (t) scene.add(t);
}

function makeRock(x, z) {
  const g = new THREE.Group();
  const y = terrainHeight(x, z);
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.95, flatShading: true });

  const sizes = [1.6, 1.1, 0.7];
  for (let i = 0; i < sizes.length; i++) {
    const geo = new THREE.BoxGeometry(sizes[i], sizes[i] * 0.75, sizes[i] * 0.9);
    const rock = new THREE.Mesh(geo, rockMat);
    rock.position.set(
      (Math.random() - 0.5) * 0.4,
      0.4 + i * 0.5,
      (Math.random() - 0.5) * 0.4
    );
    rock.rotation.set(Math.random() * 0.3, Math.random() * Math.PI, Math.random() * 0.3);
    g.add(rock);
  }
  g.position.set(x, y, z);
  return g;
}
scene.add(makeRock(4, 4));
scene.add(makeRock(-6, -8));

const frustumSize = 45;
const aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2, frustumSize * aspect / 2,
  frustumSize / 2, -frustumSize / 2,
  0.1, 500
);

const camDist = 80;
let camYaw = Math.PI * 0.25;
let camPitch = Math.atan(1 / Math.sqrt(2));

function updateCamera() {
  const x = camDist * Math.cos(camPitch) * Math.sin(camYaw);
  const y = camDist * Math.sin(camPitch);
  const z = camDist * Math.cos(camPitch) * Math.cos(camYaw);
  camera.position.set(x, y, z);
  camera.lookAt(0, 2, 0);
}
updateCamera();

let dragging = false, lastX = 0, lastY = 0, pinchDist = 0;
const el = renderer.domElement;

el.addEventListener('touchstart', function(e) {
  if (e.touches.length === 1) {
    dragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
  }
}, { passive: true });

el.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1 && dragging) {
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    camYaw -= dx * 0.008;
    camPitch = Math.max(0.25, Math.min(1.35, camPitch + dy * 0.005));
    updateCamera();
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist > 0) {
      camera.zoom = Math.max(0.4, Math.min(3.0, camera.zoom * (pinchDist / d)));
      camera.updateProjectionMatrix();
    }
    pinchDist = d;
  }
}, { passive: true });

el.addEventListener('touchend', function() {
  dragging = false;
  pinchDist = 0;
}, { passive: true });

el.addEventListener('mousedown', function(e) { dragging = true; lastX = e.clientX; lastY = e.clientY; });
el.addEventListener('mousemove', function(e) {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.008;
  camPitch = Math.max(0.25, Math.min(1.35, camPitch + (e.clientY - lastY) * 0.005));
  lastX = e.clientX;
  lastY = e.clientY;
  updateCamera();
});
el.addEventListener('mouseup', function() { dragging = false; });
el.addEventListener('wheel', function(e) {
  camera.zoom = Math.max(0.4, Math.min(3.0, camera.zoom * (1 - e.deltaY * 0.001)));
  camera.updateProjectionMatrix();
}, { passive: true });

addEventListener('resize', function() {
  const w = innerWidth, h = innerHeight, a = w / h;
  camera.left = -frustumSize * a / 2;
  camera.right = frustumSize * a / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

let frames = 0;
let lastFpsT = performance.now();
function animate() {
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - lastFpsT > 500) {
    const fps = Math.round(frames * 1000 / (now - lastFpsT));
    hud.fps.textContent = fps + ' FPS';
    hud.info.textContent = 'yaw ' + camYaw.toFixed(2) + ' . pitch ' + camPitch.toFixed(2) + ' . zoom ' + camera.zoom.toFixed(2);
    frames = 0;
    lastFpsT = now;
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
